[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "rna_draw"
version = "0.1.0"
description = "A minimal python package for drawing nucleic acid secondary structures."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Joe Yesselman", email = "jyesselm@unl.edu" }]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = ["matplotlib", "seaborn"]

[project.optional-dependencies]
# pytest-timeout: M5.1's `tests/test_vienna_binding.py` caps individual
# `@pytest.mark.timeout(...)`-marked cases (a verified upstream RNApuzzler
# hang on a degenerate empty-loop structure) so a regression fails fast
# instead of hanging CI.
dev = ["pytest", "pytest-cov", "pytest-timeout", "ruff", "mypy"]

[project.scripts]
rna_draw = "rna_draw.draw:main"

# M5.1: switched from setuptools to scikit-build-core + CMake so the growing
# C++ core (this milestone's ViennaRNA bindings, later M6/M7) has a proper
# CMake/ctest home; see .claude/plans/current-plan.md's build-system decision.
[tool.scikit-build]
cmake.source-dir = "."
# The whole `rna_draw/` tree (including the `layout` subpackage) is packaged
# as-is; the compiled `_vienna_layout` extension is installed alongside it
# by CMakeLists.txt's `install(TARGETS ... DESTINATION rna_draw)`.
wheel.packages = ["rna_draw"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Legacy renderer: complexity/line-length plus pre-existing style debt
# (== None/False comparisons, an unused local) in RNARenderer.draw()/
# setup_coords_recursive, which are explicitly out of refactor scope for M1.
"rna_draw/render_rna.py" = ["C901", "E501", "E711", "E712", "F841", "I001"]
# `from ...colorer import *` star-imports plus pre-existing import ordering.
"rna_draw/draw.py" = ["F403", "F405", "I001"]
"rna_draw/colorer.py" = ["I001"]
"generate_readme.py" = ["E741", "F401", "I001"]
"tests/test_colorer.py" = ["F401", "F841", "I001"]
"tests/test_data.py" = ["F841", "I001"]
"tests/test_render.py" = ["I001"]

[tool.mypy]
python_version = "3.9"
files = ["rna_draw", "tests"]

[[tool.mypy.overrides]]
module = [
    "rna_draw.render_rna",
    "rna_draw.draw",
    "rna_draw.colorer",
    "rna_draw.data",
    "rna_draw.parameters",
    "rna_draw.settings",
    "test_colorer",
    "test_data",
    "test_draw",
    "test_render",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["seaborn", "seaborn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The installed pytest build's own internals (_pytest/terminal.py) use
# `match` statements (Python 3.10+ syntax); since this project's mypy
# `python_version` targets 3.9, following into pytest's py.typed package
# from a test file's `import pytest` would otherwise fail on pytest's own
# source, not ours. Skip following into it -- pytest's public API is still
# usable (as `Any`), only its internals are no longer type-checked.
module = ["_pytest.*", "pytest.*"]
follow_imports = "skip"
